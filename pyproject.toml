[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vsr"
version = "0.1.0"
description = "Real-Time Multi-Frame Video Super-Resolution"
authors = [{name = "Antigravity"}]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "scikit-image>=0.21.0",
    "matplotlib>=3.8.0",
    "PyYAML>=6.0.1",
    "tqdm>=4.66.0"
]
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
